name: Integrate academic insights v4

on:
  push:
    branches:
      - feat/2026-2028-ui-reminders

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2026-2028-ui-reminders
          fetch-depth: 0
      - name: Inject academic insights script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          tag = '<script src="./academic-insights-v4.js"></script>'
          if tag not in text:
              text = text.replace('</body>', f'    {tag}\n</body>')
              p.write_text(text)
          PY
      - name: Commit integration
        run: |
          if git diff --quiet -- index.html; then
            echo "Already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load class workload and grade enhancements"
          git push origin feat/2026-2028-ui-reminders