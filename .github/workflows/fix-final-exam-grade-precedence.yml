name: Fix final exam grade precedence

on:
  push:
    branches:
      - feat/syllabus-keyword-extraction
    paths:
      - '.github/workflows/fix-final-exam-grade-precedence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/syllabus-keyword-extraction
      - name: Prefer final and midterm over generic exam
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('syllabus-keyword-v10.js')
          text = p.read_text()

          old = "const mappings=[[['homework','problem set','pset'],'Homework'],[['assignment'],'Assignments'],[['quiz'],'Quizzes'],[['test'],'Tests'],[['exam','examination'],'Exams'],[['midterm','mid-term','mid term'],'Midterm'],[['final'],'Final Exam'],[['lab','laboratory'],'Labs'],[['project','capstone'],'Projects'],[['paper','essay','report'],'Papers'],[['presentation'],'Presentations'],[['participation'],'Participation'],[['attendance'],'Attendance'],[['discussion'],'Discussions'],[['lecture note','lecture notes','class notes','course notes'],'Lecture Notes'],[['reading','readings','assigned reading','required reading','textbook reading'],'Readings'],[['portfolio'],'Portfolio']];"
          new = "const mappings=[[['final exam','final examination','final assessment','final'],'Final Exam'],[['midterm exam','midterm examination','midterm','mid-term','mid term'],'Midterm'],[['homework','problem set','pset'],'Homework'],[['assignment'],'Assignments'],[['quiz'],'Quizzes'],[['test'],'Tests'],[['exam','examination'],'Exams'],[['lab','laboratory'],'Labs'],[['project','capstone'],'Projects'],[['paper','essay','report'],'Papers'],[['presentation'],'Presentations'],[['participation'],'Participation'],[['attendance'],'Attendance'],[['discussion'],'Discussions'],[['lecture note','lecture notes','class notes','course notes'],'Lecture Notes'],[['reading','readings','assigned reading','required reading','textbook reading'],'Readings'],[['portfolio'],'Portfolio']];"
          if old not in text:
              raise SystemExit('canonical grade mapping block not found')
          text = text.replace(old, new, 1)

          marker = "const percentMatches=Array.from(normalized.matchAll(/(?:^|[^\\d])(\\d{1,3}(?:\\.\\d+)?)\\s*%/g));"
          replacement = "const explicitFinal=normalized.match(/\\b(final\\s+(?:exam|examination)|final)\\b\\s*(?:[:\\-–—]\\s*)?\\(?\\s*(\\d{1,3}(?:\\.\\d+)?)\\s*%\\s*\\)?/i);\n        if(explicitFinal){ const weight=Number(explicitFinal[2]); if(weight>0&&weight<=100)return {name:'Final Exam',weight,context:normalized}; }\n        const explicitMidterm=normalized.match(/\\b(midterm(?:\\s+(?:exam|examination))?|mid-term|mid term)\\b\\s*(?:[:\\-–—]\\s*)?\\(?\\s*(\\d{1,3}(?:\\.\\d+)?)\\s*%\\s*\\)?/i);\n        if(explicitMidterm){ const weight=Number(explicitMidterm[2]); if(weight>0&&weight<=100)return {name:'Midterm',weight,context:normalized}; }\n        const percentMatches=Array.from(normalized.matchAll(/(?:^|[^\\d])(\\d{1,3}(?:\\.\\d+)?)\\s*%/g));"
          if marker not in text:
              raise SystemExit('percent matching marker not found')
          text = text.replace(marker, replacement, 1)

          p.write_text(text)
          PY
      - name: Commit final exam parser fix and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add syllabus-keyword-v10.js
          git rm .github/workflows/fix-final-exam-grade-precedence.yml
          git commit -m "Recognize parenthesized final exam grade weights"
          git push origin HEAD:feat/syllabus-keyword-extraction