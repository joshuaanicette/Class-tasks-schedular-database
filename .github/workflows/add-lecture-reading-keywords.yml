name: Add lecture and reading syllabus keywords

on:
  push:
    branches:
      - feat/syllabus-keyword-extraction
    paths:
      - '.github/workflows/add-lecture-reading-keywords.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/syllabus-keyword-extraction
      - name: Expand syllabus reading keywords
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('syllabus-keyword-v10.js')
          text = p.read_text()
          old = "{ type: 'reading', label: 'Reading', words: ['reading', 'readings', 'chapter', 'chapters'] },"
          new = "{ type: 'reading', label: 'Reading', words: ['lecture note', 'lecture notes', 'class notes', 'course notes', 'reading', 'readings', 'assigned reading', 'assigned readings', 'required reading', 'required readings', 'textbook reading', 'textbook readings', 'read before class', 'chapter', 'chapters'] },"
          if old not in text:
              raise SystemExit('reading type rule not found')
          text = text.replace(old, new, 1)
          old_score = r"(?:hw|quiz|test|exam|lab|project|paper|assignment|module|week)"
          new_score = r"(?:hw|quiz|test|exam|lab|project|paper|assignment|reading|lecture\s+notes?|chapter|module|week)"
          if old_score not in text:
              raise SystemExit('numbered keyword scoring rule not found')
          text = text.replace(old_score, new_score, 1)
          old_msg = "No assignment, quiz, exam, project, lab, reading, or due-date keywords were confidently matched in the syllabus."
          new_msg = "No assignment, quiz, exam, project, lab, lecture-notes, reading, or due-date keywords were confidently matched in the syllabus."
          text = text.replace(old_msg, new_msg, 1)
          p.write_text(text)
          PY
      - name: Commit keyword update and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add syllabus-keyword-v10.js
          git rm .github/workflows/add-lecture-reading-keywords.yml
          git commit -m "Recognize lecture notes and richer reading keywords"
          git push origin HEAD:feat/syllabus-keyword-extraction