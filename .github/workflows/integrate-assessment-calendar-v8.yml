name: Integrate assessment calendar v8

on:
  push:
    branches:
      - feat/assessments-weekly-tracker
    paths:
      - '.github/workflows/integrate-assessment-calendar-v8.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assessments-weekly-tracker
      - name: Load assessment calendar refinement
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          marker = '<script src="./assessment-weekly-v7.js"></script>'
          loader = '<script src="./assessment-calendar-v8.js"></script>'
          if loader not in text:
              if marker not in text:
                  raise SystemExit('assessment-weekly-v7 loader not found')
              text = text.replace(marker, marker + '\n' + loader, 1)
              p.write_text(text)
          PY
      - name: Commit loader
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Load assessment time frame and calendar tracker refinement"
          git push origin HEAD:feat/assessments-weekly-tracker