name: Unify palette panel v10

on:
  push:
    branches:
      - feat/expanded-palette-gallery
    paths:
      - '.github/workflows/unify-palette-panel-v10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/expanded-palette-gallery
      - name: Show every palette in one panel
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('palette-gallery-v9.js')
          text = p.read_text()

          text = text.replace('width:min(760px,calc(100vw - 28px));', 'width:min(1040px,calc(100vw - 28px));')
          text = text.replace('max-height:min(72vh,720px)!important;', 'max-height:min(82vh,820px)!important;')
          text = text.replace('.v9-palette-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}', '.v9-palette-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}')
          text = text.replace('@media(max-width:760px){.theme-menu.v9-palette-gallery{position:fixed!important;left:12px!important;right:12px!important;top:74px!important;width:auto!important;max-height:calc(100vh - 92px)!important}.v9-palette-grid{grid-template-columns:1fr}.v9-palette-card{grid-template-columns:96px 1fr}}', '@media(max-width:980px){.v9-palette-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.theme-menu.v9-palette-gallery{position:fixed!important;left:12px!important;right:12px!important;top:74px!important;width:auto!important;max-height:calc(100vh - 92px)!important}.v9-palette-grid{grid-template-columns:1fr}.v9-palette-card{grid-template-columns:96px 1fr}}')

          start = text.index('    function renderPaletteGallery() {')
          end = text.index('    function updateSelectedCard(selectedId) {')
          new = '''    function renderPaletteGallery() {
        const menu = document.getElementById('themeMenu');
        if (!menu) return;
        const selectedId = localStorage.getItem('selectedTheme') || 'default';

        menu.classList.add('v9-palette-gallery');
        menu.innerHTML = `
            <div class="v9-palette-header">
                <div><h3>🎨 All Color Palettes</h3><p>All original and expanded palettes are shown together in one panel.</p></div>
                <span class="v9-palette-count">${PALETTES.length} palettes</span>
            </div>
            <div class="v9-palette-grid">${PALETTES.map(p => paletteCard(p, selectedId)).join('')}</div>`;

        menu.querySelectorAll('[data-v9-palette]').forEach(card => {
            card.addEventListener('click', event => {
                event.stopPropagation();
                applyPalette(card.dataset.v9Palette);
            });
        });
    }

'''
          text = text[:start] + new + text[end:]
          p.write_text(text)
          PY
      - name: Commit unified palette panel
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add palette-gallery-v9.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Show all palettes in one dropdown panel"
          git push origin HEAD:feat/expanded-palette-gallery
