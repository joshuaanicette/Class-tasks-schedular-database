name: Refine assessment weekly v7

on:
  push:
    branches:
      - feat/assessments-weekly-tracker
    paths:
      - '.github/workflows/refine-assessment-weekly-v7.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assessments-weekly-tracker
      - name: Replace end-time UI with time frame and move weekly tracker to Calendar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('assessment-weekly-v7.js')
          text = p.read_text()

          text = text.replace(
              ".v7-assessment-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}",
              ".v7-assessment-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}"
          )

          old_panel = '''            <div class="v7-assessment-fields">
                <label>Assessment date<input type="date" id="v7AssessmentDate"></label>
                <label>Start time<input type="time" id="v7AssessmentStart"></label>
                <label>End time<input type="time" id="v7AssessmentEnd"></label>
            </div>
            <div class="v7-assessment-note">The normal assignment due date is synchronized to the assessment start time so reminders, calendar entries, and sorting continue to work.</div>`;
        row.insertAdjacentElement('afterend', panel);

        ['v7AssessmentDate', 'v7AssessmentStart', 'v7AssessmentEnd'].forEach(id => {
            document.getElementById(id)?.addEventListener('input', syncAssessmentToDueDate);
        });'''
          new_panel = '''            <div class="v7-assessment-fields">
                <label>Assessment date<input type="date" id="v7AssessmentDate"></label>
                <label>Time frame<input type="text" id="v7AssessmentTimeFrame" placeholder="10:00 AM - 11:20 AM"></label>
            </div>
            <div class="v7-assessment-note">Enter the full assessment time frame in one field. The start of that time frame is synchronized to the normal due date so reminders, calendar entries, and sorting continue to work.</div>`;
        row.insertAdjacentElement('afterend', panel);

        ['v7AssessmentDate', 'v7AssessmentTimeFrame'].forEach(id => {
            document.getElementById(id)?.addEventListener('input', syncAssessmentToDueDate);
        });'''
          if old_panel not in text:
              raise SystemExit('assessment panel block not found')
          text = text.replace(old_panel, new_panel, 1)

          old_sync = '''    function syncAssessmentToDueDate() {
        if (!isAssessmentType(assignmentType())) return;
        const date = document.getElementById('v7AssessmentDate')?.value || '';
        const start = document.getElementById('v7AssessmentStart')?.value || '';
        const due = document.getElementById('dueDate');
        if (due && date && start) due.value = `${date}T${start}`;
    }
'''
          new_sync = '''    function parseClockText(value) {
        const match = String(value || '').trim().match(/^(\\d{1,2})(?::(\\d{2}))?\\s*(AM|PM)?$/i);
        if (!match) return null;
        let hour = Number(match[1]);
        const minute = Number(match[2] || 0);
        const suffix = String(match[3] || '').toUpperCase();
        if (!Number.isFinite(hour) || !Number.isFinite(minute) || minute < 0 || minute > 59) return null;
        if (suffix) {
            if (hour < 1 || hour > 12) return null;
            if (suffix === 'PM' && hour !== 12) hour += 12;
            if (suffix === 'AM' && hour === 12) hour = 0;
        } else if (hour < 0 || hour > 23) {
            return null;
        }
        return {
            minutes: hour * 60 + minute,
            time24: `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`
        };
    }

    function parseTimeFrame(value) {
        const parts = String(value || '').trim().split(/\\s*(?:-|–|—|\\bto\\b)\\s*/i);
        if (parts.length !== 2) return null;
        const start = parseClockText(parts[0]);
        const end = parseClockText(parts[1]);
        if (!start || !end || end.minutes <= start.minutes) return null;
        return { startMinutes: start.minutes, endMinutes: end.minutes, start24: start.time24, end24: end.time24 };
    }

    function formatMinutes(minutes) {
        const hour24 = Math.floor(minutes / 60);
        const minute = minutes % 60;
        const suffix = hour24 >= 12 ? 'PM' : 'AM';
        return `${hour24 % 12 || 12}:${String(minute).padStart(2, '0')} ${suffix}`;
    }

    function normalizedTimeFrame(value) {
        const parsed = parseTimeFrame(value);
        return parsed ? `${formatMinutes(parsed.startMinutes)}–${formatMinutes(parsed.endMinutes)}` : String(value || '').trim();
    }

    function syncAssessmentToDueDate() {
        if (!isAssessmentType(assignmentType())) return;
        const date = document.getElementById('v7AssessmentDate')?.value || '';
        const frame = parseTimeFrame(document.getElementById('v7AssessmentTimeFrame')?.value || '');
        const due = document.getElementById('dueDate');
        if (due && date && frame) due.value = `${date}T${frame.start24}`;
    }
'''
          if old_sync not in text:
              raise SystemExit('sync block not found')
          text = text.replace(old_sync, new_sync, 1)

          old_populate = '''            const fallbackTime = Number.isNaN(taskDate.getTime()) ? '' : `${String(taskDate.getHours()).padStart(2, '0')}:${String(taskDate.getMinutes()).padStart(2, '0')}`;
            const date = document.getElementById('v7AssessmentDate');
            const start = document.getElementById('v7AssessmentStart');
            const end = document.getElementById('v7AssessmentEnd');
            if (date) date.value = task.assessmentDate || fallbackDate;
            if (start) start.value = task.assessmentStartTime || fallbackTime;
            if (end) end.value = task.assessmentEndTime || '';
            syncAssessmentToDueDate();'''
          new_populate = '''            const fallbackTime = Number.isNaN(taskDate.getTime()) ? '' : `${String(taskDate.getHours()).padStart(2, '0')}:${String(taskDate.getMinutes()).padStart(2, '0')}`;
            const date = document.getElementById('v7AssessmentDate');
            const timeFrame = document.getElementById('v7AssessmentTimeFrame');
            const legacyFrame = task.assessmentStartTime && task.assessmentEndTime
                ? `${formatClock(task.assessmentStartTime)}–${formatClock(task.assessmentEndTime)}`
                : (task.assessmentStartTime ? formatClock(task.assessmentStartTime) : (fallbackTime ? formatClock(fallbackTime) : ''));
            if (date) date.value = task.assessmentDate || fallbackDate;
            if (timeFrame) timeFrame.value = task.assessmentTimeFrame || legacyFrame;
            syncAssessmentToDueDate();'''
          if old_populate not in text:
              raise SystemExit('populate block not found')
          text = text.replace(old_populate, new_populate, 1)

          text = text.replace(
              "['v7AssessmentDate', 'v7AssessmentStart', 'v7AssessmentEnd'].forEach(id => {",
              "['v7AssessmentDate', 'v7AssessmentTimeFrame'].forEach(id => {",
              1
          )

          old_draft = '''        return {
            type,
            assessmentDate: document.getElementById('v7AssessmentDate')?.value || '',
            assessmentStartTime: document.getElementById('v7AssessmentStart')?.value || '',
            assessmentEndTime: document.getElementById('v7AssessmentEnd')?.value || ''
        };'''
          new_draft = '''        return {
            type,
            assessmentDate: document.getElementById('v7AssessmentDate')?.value || '',
            assessmentTimeFrame: document.getElementById('v7AssessmentTimeFrame')?.value || ''
        };'''
          if old_draft not in text:
              raise SystemExit('draft block not found')
          text = text.replace(old_draft, new_draft, 1)

          old_validate = '''        if (!draft.assessmentDate || !draft.assessmentStartTime || !draft.assessmentEndTime) {
            scheduler?.showNotification('Quiz/Test/Exam requires a date, start time, and end time.', 'error');
            return false;
        }
        const start = timeMinutes(draft.assessmentStartTime);
        const end = timeMinutes(draft.assessmentEndTime);
        if (start == null || end == null || end <= start) {
            scheduler?.showNotification('Assessment end time must be later than the start time.', 'error');
            return false;
        }'''
          new_validate = '''        if (!draft.assessmentDate || !draft.assessmentTimeFrame) {
            scheduler?.showNotification('Quiz/Test/Exam requires a date and time frame.', 'error');
            return false;
        }
        const frame = parseTimeFrame(draft.assessmentTimeFrame);
        if (!frame) {
            scheduler?.showNotification('Enter the time frame like 10:00 AM - 11:20 AM.', 'error');
            return false;
        }'''
          if old_validate not in text:
              raise SystemExit('validation block not found')
          text = text.replace(old_validate, new_validate, 1)

          old_apply = '''            delete task.assessmentStartTime;
            delete task.assessmentEndTime;
            return;
        }
        task.scheduledAssessment = true;
        task.assessmentDate = draft.assessmentDate;
        task.assessmentStartTime = draft.assessmentStartTime;
        task.assessmentEndTime = draft.assessmentEndTime;
        task.dueDate = new Date(`${draft.assessmentDate}T${draft.assessmentStartTime}`);'''
          new_apply = '''            delete task.assessmentStartTime;
            delete task.assessmentEndTime;
            delete task.assessmentTimeFrame;
            return;
        }
        const frame = parseTimeFrame(draft.assessmentTimeFrame);
        task.scheduledAssessment = true;
        task.assessmentDate = draft.assessmentDate;
        task.assessmentTimeFrame = normalizedTimeFrame(draft.assessmentTimeFrame);
        delete task.assessmentStartTime;
        delete task.assessmentEndTime;
        task.dueDate = new Date(`${draft.assessmentDate}T${frame.start24}`);'''
          if old_apply not in text:
              raise SystemExit('apply block not found')
          text = text.replace(old_apply, new_apply, 1)

          old_schedule = '''        const start = task.assessmentStartTime || '';
        const end = task.assessmentEndTime || '';
        const range = start && end ? `${formatClock(start)}–${formatClock(end)}` : (start ? formatClock(start) : '');
        const duration = durationText(start, end);
        const dateText = date ? new Date(`${date}T12:00:00`).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
        return [dateText, range, duration ? `(${duration})` : ''].filter(Boolean).join(' · ');'''
          new_schedule = '''        const legacyStart = task.assessmentStartTime || '';
        const legacyEnd = task.assessmentEndTime || '';
        const range = task.assessmentTimeFrame
            ? normalizedTimeFrame(task.assessmentTimeFrame)
            : (legacyStart && legacyEnd ? `${formatClock(legacyStart)}–${formatClock(legacyEnd)}` : (legacyStart ? formatClock(legacyStart) : ''));
        const parsed = task.assessmentTimeFrame ? parseTimeFrame(task.assessmentTimeFrame) : null;
        const duration = parsed ? formatDurationMinutes(parsed.endMinutes - parsed.startMinutes) : durationText(legacyStart, legacyEnd);
        const dateText = date ? new Date(`${date}T12:00:00`).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
        return [dateText, range, duration ? `(${duration})` : ''].filter(Boolean).join(' · ');'''
          if old_schedule not in text:
              raise SystemExit('schedule display block not found')
          text = text.replace(old_schedule, new_schedule, 1)

          marker = '''    function assessmentScheduleText(task) {'''
          helper = '''    function formatDurationMinutes(mins) {
        if (!(mins > 0)) return '';
        const hours = Math.floor(mins / 60);
        const rest = mins % 60;
        if (hours && rest) return `${hours}h ${rest}m`;
        if (hours) return `${hours}h`;
        return `${rest}m`;
    }

'''
          if helper not in text:
              text = text.replace(marker, helper + marker, 1)

          old_inject = '''    function injectWeeklyTracker() {
        const assignments = document.getElementById('assignments');
        const taskList = document.getElementById('taskList');
        if (!assignments || !taskList || document.getElementById('v7WeeklyTracker')) return;
        const tasksSection = taskList.closest('.tasks-section');
        if (!tasksSection) return;
        const tracker = document.createElement('div');
        tracker.id = 'v7WeeklyTracker';
        tracker.className = 'v7-weekly-tracker';
        tasksSection.insertAdjacentElement('beforebegin', tracker);
    }'''
          new_inject = '''    function injectWeeklyTracker() {
        const calendarGrid = document.getElementById('calendarGrid');
        const calendarView = calendarGrid?.closest('.calendar-view');
        if (!calendarGrid || !calendarView || document.getElementById('v7WeeklyTracker')) return;
        const tracker = document.createElement('div');
        tracker.id = 'v7WeeklyTracker';
        tracker.className = 'v7-weekly-tracker';
        calendarView.insertAdjacentElement('afterend', tracker);
    }'''
          if old_inject not in text:
              raise SystemExit('weekly tracker injection block not found')
          text = text.replace(old_inject, new_inject, 1)

          text = text.replace(
              "return task.assessmentStartTime ? assessmentScheduleText(task).split(' · ').slice(1).join(' · ') : new Date(task.dueDate).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });",
              "return (task.assessmentTimeFrame || task.assessmentStartTime) ? assessmentScheduleText(task).split(' · ').slice(1).join(' · ') : new Date(task.dueDate).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });",
              1
          )

          render_tasks_block = '''        const originalRenderTasks = scheduler.renderTasks.bind(scheduler);
        scheduler.renderTasks = function (...args) {
            const result = originalRenderTasks(...args);
            renderWeeklyTracker();
            return result;
        };
'''
          render_calendar_block = '''        const originalRenderCalendar = scheduler.renderCalendar?.bind(scheduler);
        if (originalRenderCalendar) {
            scheduler.renderCalendar = function (...args) {
                const result = originalRenderCalendar(...args);
                renderWeeklyTracker();
                return result;
            };
        }

'''
          if render_tasks_block not in text:
              raise SystemExit('renderTasks wrapper not found')
          if render_calendar_block not in text:
              text = text.replace(render_tasks_block, render_tasks_block + '\n' + render_calendar_block, 1)

          p.write_text(text)
          PY
      - name: Commit refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assessment-weekly-v7.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use assessment time frames and move weekly tracker to calendar"
          git push origin HEAD:feat/assessments-weekly-tracker