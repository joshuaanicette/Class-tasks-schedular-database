name: Integrate course components clean

on:
  push:
    branches:
      - feat/course-components

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/course-components
          fetch-depth: 0
      - name: Inject course component script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          tag = '<script src="./course-components-v5.js"></script>'
          if tag not in text:
              text = text.replace('</body>', f'    {tag}\n</body>')
              p.write_text(text)
          PY
      - name: Commit integration
        run: |
          if git diff --quiet -- index.html; then
            echo "Already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load course component enhancements"
          git push origin feat/course-components