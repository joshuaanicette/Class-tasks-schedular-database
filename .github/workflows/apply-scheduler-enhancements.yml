name: Apply scheduler enhancements

on:
  push:
    branches:
      - feat/2026-2028-ui-reminders

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/2026-2028-ui-reminders

      - name: Inject enhancement assets
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css = '    <link rel="stylesheet" href="./enhancements.css">\n'
          js = '    <script src="./enhancements-v2.js"></script>\n'

          if './enhancements.css' not in text:
              text = text.replace('</head>', css + '</head>', 1)

          if './enhancements-v2.js' not in text:
              text = text.replace('</body>', js + '</body>', 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire 2026-2028 UI and reminder enhancements"
          git push origin HEAD:feat/2026-2028-ui-reminders
